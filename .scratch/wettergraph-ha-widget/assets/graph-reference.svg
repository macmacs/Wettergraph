<svg xmlns="http://www.w3.org/2000/svg" width="782" height="391" viewBox="0 0 782 391" font-family="DejaVu Sans, sans-serif">
  <!--
    Reference layout for assets/graph-spec.md, drawn at the design width W=782 (H=391).
    Hand-made and independent of the renderer that ticket 05 will write. Real numbers:
    a 48 h window starting Sunday 12:00 local; temperatures -1.7 .. 9.9 C, so the axis
    fits to -5 .. 15 C with one 5 C step reserved at the top for the icon row; the 0 C
    line is drawn heavier; precipitation peaks at 1.2 mm/h, so the band top is 2 mm/h;
    one icon every 3 h, each riding 3 px above the curve below it. Light theme.
    Nothing here is wind-shaped.
  -->
  <defs>
    <mask id="moon-bite">
      <rect width="28" height="28" fill="#ffffff"/>
      <circle cx="18.4" cy="11.2" r="7" fill="#000000"/>
    </mask>

    <!-- 28 x 28 icon boxes, one per glyph this reference needs. Ticket 03 supplies the real MET art. -->
    <g id="g-sun">
      <circle cx="14" cy="14" r="5.6" fill="#f5a623"/>
      <g stroke="#f5a623" stroke-width="1.8" stroke-linecap="round">
        <line x1="21.4" y1="14" x2="23.6" y2="14"/>
        <line x1="19.2" y1="19.2" x2="20.8" y2="20.8"/>
        <line x1="14" y1="21.4" x2="14" y2="23.6"/>
        <line x1="8.8" y1="19.2" x2="7.2" y2="20.8"/>
        <line x1="6.6" y1="14" x2="4.4" y2="14"/>
        <line x1="8.8" y1="8.8" x2="7.2" y2="7.2"/>
        <line x1="14" y1="6.6" x2="14" y2="4.4"/>
        <line x1="19.2" y1="8.8" x2="20.8" y2="7.2"/>
      </g>
    </g>

    <g id="g-cloud" fill="#dbe2e8">
      <circle cx="10.5" cy="16.5" r="5"/>
      <circle cx="17" cy="15.5" r="6"/>
      <circle cx="14" cy="19" r="4"/>
      <rect x="5.5" y="16.5" width="17" height="5" rx="2.5"/>
    </g>

    <g id="g-suncloud">
      <use href="#g-sun" transform="translate(6,-4) scale(0.7)"/>
      <use href="#g-cloud" transform="translate(-2,3) scale(0.85)"/>
    </g>

    <g id="g-moon">
      <circle cx="14" cy="14" r="7.5" fill="#e8c34a" mask="url(#moon-bite)"/>
    </g>

    <g id="g-mooncloud">
      <use href="#g-moon" transform="translate(6,-4) scale(0.7)"/>
      <use href="#g-cloud" transform="translate(-2,3) scale(0.85)"/>
    </g>

    <g id="g-rain">
      <use href="#g-cloud" transform="translate(0,-3)"/>
      <g stroke="#4a7fd4" stroke-width="1.8" stroke-linecap="round">
        <line x1="9" y1="21.5" x2="7.4" y2="25.5"/>
        <line x1="14.5" y1="21.5" x2="12.9" y2="25.5"/>
        <line x1="20" y1="21.5" x2="18.4" y2="25.5"/>
      </g>
    </g>
  </defs>

  <!-- background -->
  <rect width="782" height="391" fill="#ffffff"/>

  <!-- temperature panel: a horizontal grid line every 5 C; the 0 C line is drawn heavier -->
  <g stroke="#dfe3e8" stroke-width="1">
    <line x1="44" y1="8" x2="774" y2="8"/>
    <line x1="44" y1="76.8" x2="774" y2="76.8"/>
    <line x1="44" y1="145.5" x2="774" y2="145.5"/>
    <line x1="44" y1="283" x2="774" y2="283"/>
  </g>
  <line x1="44" y1="214.2" x2="774" y2="214.2" stroke="#b9c0c8" stroke-width="1.5"/>

  <!-- time grid: every 6 h, heavier at local midnight (Mo = Monday 00:00, Di = Tuesday 00:00) -->
  <g stroke="#dfe3e8" stroke-width="1">
    <line x1="135.2" y1="8" x2="135.2" y2="283"/>
    <line x1="317.8" y1="8" x2="317.8" y2="283"/>
    <line x1="409" y1="8" x2="409" y2="283"/>
    <line x1="500.2" y1="8" x2="500.2" y2="283"/>
    <line x1="682.8" y1="8" x2="682.8" y2="283"/>
  </g>
  <g stroke="#aab2bb" stroke-width="1.5">
    <line x1="226.5" y1="8" x2="226.5" y2="283"/>
    <line x1="591.5" y1="8" x2="591.5" y2="283"/>
  </g>

  <!-- temperature curve: Catmull-Rom through 49 hourly points, tension 0.5, 2.5 px -->
  <path fill="none" stroke="#d81e05" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
        d="M 44.0 189.5 C 46.5 190.2 54.1 192.2 59.2 193.6 C 64.3 195.0 69.3 196.6 74.4 197.8 C 79.5 198.9 84.6 199.8 89.6 200.5 C 94.7 201.2 99.8 202.3 104.8 201.9 C 109.9 201.4 115.0 200.3 120.0 197.8 C 125.1 195.2 130.2 191.6 135.2 186.8 C 140.3 181.9 145.4 175.1 150.5 168.9 C 155.5 162.7 160.6 155.8 165.7 149.6 C 170.7 143.4 175.8 136.8 180.9 131.8 C 185.9 126.7 191.0 123.0 196.1 119.4 C 201.2 115.7 206.2 112.7 211.3 109.8 C 216.4 106.8 221.4 104.5 226.5 101.5 C 231.6 98.5 236.6 95.1 241.7 91.9 C 246.8 88.7 251.8 84.5 256.9 82.2 C 262.0 80.0 267.1 78.4 272.1 78.1 C 277.2 77.9 282.3 78.6 287.3 80.9 C 292.4 83.2 297.5 87.1 302.5 91.9 C 307.6 96.7 312.7 103.8 317.8 109.8 C 322.8 115.7 327.9 121.9 333.0 127.6 C 338.0 133.4 343.1 138.9 348.2 144.1 C 353.2 149.4 358.3 154.4 363.4 159.2 C 368.4 164.1 373.5 168.0 378.6 173.0 C 383.7 178.0 388.7 183.8 393.8 189.5 C 398.9 195.2 403.9 201.6 409.0 207.4 C 414.1 213.1 419.1 219.3 424.2 223.9 C 429.3 228.5 434.3 232.6 439.4 234.9 C 444.5 237.2 449.6 238.1 454.6 237.6 C 459.7 237.2 464.8 234.6 469.8 232.1 C 474.9 229.6 480.0 225.9 485.0 222.5 C 490.1 219.1 495.2 214.9 500.2 211.5 C 505.3 208.1 510.4 205.1 515.5 201.9 C 520.5 198.7 525.6 196.1 530.7 192.2 C 535.7 188.4 540.8 184.0 545.9 178.5 C 550.9 173.0 556.0 165.7 561.1 159.2 C 566.2 152.8 571.2 146.4 576.3 140.0 C 581.4 133.6 586.4 126.0 591.5 120.7 C 596.6 115.5 601.6 111.4 606.7 108.4 C 611.8 105.4 616.8 103.6 621.9 102.9 C 627.0 102.2 632.1 103.6 637.1 104.2 C 642.2 104.9 647.3 106.1 652.3 107.0 C 657.4 107.9 662.5 108.6 667.5 109.8 C 672.6 110.9 677.7 112.0 682.8 113.9 C 687.8 115.7 692.9 117.8 698.0 120.7 C 703.0 123.7 708.1 126.9 713.2 131.8 C 718.2 136.6 723.3 143.7 728.4 149.6 C 733.4 155.6 738.5 161.8 743.6 167.5 C 748.7 173.2 753.7 179.6 758.8 184.0 C 763.9 188.4 771.5 192.0 774.0 193.6"/>

  <!-- icon row: one box every 3 h, riding 3 px above the highest curve point under it -->
  <g>
    <use href="#g-suncloud"  x="30.0"  y="158.5"/>
    <use href="#g-cloud"     x="75.6"  y="166.8"/>
    <use href="#g-cloud"     x="121.2" y="137.9"/>
    <use href="#g-mooncloud" x="166.9" y="88.4"/>
    <use href="#g-moon"      x="212.5" y="60.9"/>
    <use href="#g-moon"      x="258.1" y="47.1"/>
    <use href="#g-mooncloud" x="303.8" y="60.9"/>
    <use href="#g-suncloud"  x="349.4" y="113.1"/>
    <use href="#g-rain"      x="395.0" y="158.5"/>
    <use href="#g-rain"      x="440.6" y="201.1"/>
    <use href="#g-cloud"     x="486.2" y="170.9"/>
    <use href="#g-rain"      x="531.9" y="128.2"/>
    <use href="#g-cloud"     x="577.5" y="77.4"/>
    <use href="#g-mooncloud" x="623.1" y="71.9"/>
    <use href="#g-moon"      x="668.8" y="78.8"/>
    <use href="#g-sun"       x="714.4" y="100.8"/>
  </g>

  <!-- precipitation band: one filled area, top edge joined straight between hourly points.
       Every value here is above zero, so the band is drawn (spec 7.6 covers the dry case). -->
  <path fill="#4a7fd4" fill-opacity="0.55"
        d="M 44.0 383.0 L 44.0 383.0 L 59.2 383.0 L 74.4 383.0 L 89.6 383.0 L 104.8 383.0 L 120.0 383.0 L 135.2 383.0 L 150.5 383.0 L 165.7 383.0 L 180.9 383.0 L 196.1 383.0 L 211.3 383.0 L 226.5 383.0 L 241.7 383.0 L 256.9 383.0 L 272.1 383.0 L 287.3 383.0 L 302.5 383.0 L 317.8 383.0 L 333.0 383.0 L 348.2 369.2 L 363.4 355.4 L 378.6 341.6 L 393.8 327.8 L 409.0 334.7 L 424.2 350.8 L 439.4 366.9 L 454.6 383.0 L 469.8 383.0 L 485.0 383.0 L 500.2 383.0 L 515.5 383.0 L 530.7 383.0 L 545.9 369.2 L 561.1 369.2 L 576.3 383.0 L 591.5 383.0 L 606.7 383.0 L 621.9 383.0 L 637.1 383.0 L 652.3 383.0 L 667.5 383.0 L 682.8 383.0 L 698.0 383.0 L 713.2 383.0 L 728.4 383.0 L 743.6 383.0 L 758.8 383.0 L 774.0 383.0 Z"/>
  <path fill="none" stroke="#4a7fd4" stroke-width="1.5"
        d="M 44.0 383.0 L 59.2 383.0 L 74.4 383.0 L 89.6 383.0 L 104.8 383.0 L 120.0 383.0 L 135.2 383.0 L 150.5 383.0 L 165.7 383.0 L 180.9 383.0 L 196.1 383.0 L 211.3 383.0 L 226.5 383.0 L 241.7 383.0 L 256.9 383.0 L 272.1 383.0 L 287.3 383.0 L 302.5 383.0 L 317.8 383.0 L 333.0 383.0 L 348.2 369.2 L 363.4 355.4 L 378.6 341.6 L 393.8 327.8 L 409.0 334.7 L 424.2 350.8 L 439.4 366.9 L 454.6 383.0 L 469.8 383.0 L 485.0 383.0 L 500.2 383.0 L 515.5 383.0 L 530.7 383.0 L 545.9 369.2 L 561.1 369.2 L 576.3 383.0 L 591.5 383.0 L 606.7 383.0 L 621.9 383.0 L 637.1 383.0 L 652.3 383.0 L 667.5 383.0 L 682.8 383.0 L 698.0 383.0 L 713.2 383.0 L 728.4 383.0 L 743.6 383.0 L 758.8 383.0 L 774.0 383.0"/>
  <line x1="44" y1="383" x2="774" y2="383" stroke="#c8cfd7" stroke-width="1"/>
  <text x="48" y="299" fill="#4a5158" font-size="11">2 mm/h</text>

  <!-- axis labels: temperature values right-aligned in the gutter, weekday names on the midnights -->
  <g fill="#4a5158" font-size="11" text-anchor="end">
    <text x="38" y="12">15 °C</text>
    <text x="38" y="80.8">10</text>
    <text x="38" y="149.5">5</text>
    <text x="38" y="218.2">0</text>
    <text x="38" y="287">-5</text>
  </g>
  <g fill="#4a5158" font-size="12" text-anchor="middle">
    <text x="226.5" y="280">Mo</text>
    <text x="591.5" y="280">Di</text>
  </g>

  <!-- stale marker (spec 8.2): 6 px dot plus the age, in a chip that covers what is under it -->
  <g>
    <rect x="704" y="8" width="70" height="18" rx="3" fill="#ffffff" fill-opacity="0.85"/>
    <circle cx="712" cy="17" r="3" fill="#b45309"/>
    <text x="720" y="21" fill="#b45309" font-size="11">vor 7 h</text>
  </g>
</svg>
