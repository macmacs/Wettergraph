name: Android CI with Gradle

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Build with Gradle
        env:
          WETTERGRAPH_USER_AGENT: ${{ secrets.WETTERGRAPH_USER_AGENT }}
          WETTERGRAPH_API_KEY: ${{ secrets.WETTERGRAPH_API_KEY }}
          WETTERGRAPH_USER_GEONAMES: ${{ secrets.WETTERGRAPH_USER_GEONAMES }}
        run: ./gradlew build
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wettergraph_apk
          path: app/build/outputs/apk/debug/**.apk
