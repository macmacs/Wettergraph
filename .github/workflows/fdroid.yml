name: Publish F-Droid repo

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Also publish the F-Droid index (screenshots always run)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fdroid-publish
  cancel-in-progress: false

env:
  PACKAGE_ID: io.github.macmacs.af
  FDROID_DIR: ${{ github.workspace }}/.fdroid-work
  PAGES_DIR: ${{ github.workspace }}/.gh-pages
  KEYSTORE_PATH: ${{ github.workspace }}/.release.jks

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Android SDK and AVD
        run: |
          set -eu
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMGR="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          [[ -x "$SDKMGR" ]] || SDKMGR="$(command -v sdkmanager)"
          [[ -x "$AVDMGR" ]] || AVDMGR="$(command -v avdmanager)"
          yes | "$SDKMGR" --licenses > /dev/null
          "$SDKMGR" "emulator" "system-images;android-35;google_apis;x86_64" > /dev/null
          echo no | "$AVDMGR" create avd -n wettergraph_pixel9 \
            -k "system-images;android-35;google_apis;x86_64" -d pixel_6 --force
          CFG=""
          for base in "${ANDROID_AVD_HOME:-}" "${ANDROID_USER_HOME:-$HOME/.android}/avd" "$HOME/.android/avd" "$HOME/.config/.android/avd"; do
            if [[ -n "$base" && -f "$base/wettergraph_pixel9.avd/config.ini" ]]; then
              CFG="$base/wettergraph_pixel9.avd/config.ini"
              break
            fi
          done
          [[ -n "$CFG" ]] || {
            echo "AVD config.ini not found:"
            find / -name config.ini -path "*wettergraph*" 2>/dev/null || true
            ls -la "$HOME/.android" 2>/dev/null || true
            exit 1
          }
          echo "Patching AVD config: $CFG"
          sed -i 's/^hw.lcd.width.*/hw.lcd.width = 1080/; s/^hw.lcd.height.*/hw.lcd.height = 2424/; s/^hw.lcd.density.*/hw.lcd.density = 420/; s/^hw.ramSize.*/hw.ramSize = 2048/' "$CFG"

      - name: Install Pillow
        run: |
          python3 -m venv /tmp/shotvenv
          /tmp/shotvenv/bin/pip install Pillow
          echo "/tmp/shotvenv/bin" >> "$GITHUB_PATH"

      - name: Capture screenshots
        env:
          WETTERGRAPH_USER_AGENT: ${{ secrets.WETTERGRAPH_USER_AGENT }}
          WETTERGRAPH_API_KEY: ${{ secrets.WETTERGRAPH_API_KEY }}
          WETTERGRAPH_USER_GEONAMES: ${{ secrets.WETTERGRAPH_USER_GEONAMES }}
        run: scripts/capture-screenshots.sh

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: fastlane/metadata/android/en-US/images/phoneScreenshots/*.png
          if-no-files-found: error

      - name: Commit screenshots to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fastlane/metadata/android/en-US/images/phoneScreenshots/
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
          else
            git commit -m "Updated screenshots for ${{ github.ref_name }}"
            git push origin HEAD:main
          fi

  publish:
    needs: screenshots
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download screenshots
        uses: actions/download-artifact@v4
        with:
          name: screenshots
          path: fastlane/metadata/android/en-US/images/phoneScreenshots

      - name: Remove legacy screenshot files
        run: rm -f fastlane/metadata/android/en-US/images/phoneScreenshots/af_weather_*.png

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"

      - name: Build signed release APK
        env:
          WETTERGRAPH_USER_AGENT: ${{ secrets.WETTERGRAPH_USER_AGENT }}
          WETTERGRAPH_API_KEY: ${{ secrets.WETTERGRAPH_API_KEY }}
          WETTERGRAPH_USER_GEONAMES: ${{ secrets.WETTERGRAPH_USER_GEONAMES }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: apk
        run: ./gradlew --no-daemon assembleRelease

      - name: Install fdroidserver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmagic1t64 \
            || sudo apt-get install -y --no-install-recommends libmagic1
          pipx install fdroidserver

      - name: Put Android build-tools on PATH
        run: ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1 >> "$GITHUB_PATH"

      - name: Check out existing gh-pages
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            "$PAGES_DIR"
          cd "$PAGES_DIR"
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch --depth 1 origin gh-pages:gh-pages
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rqf .
          fi

      - name: Assemble F-Droid working directory
        run: |
          set -eu
          mkdir -p "$FDROID_DIR/repo" "$FDROID_DIR/metadata"
          cp fdroid/config.yml "$FDROID_DIR/config.yml"
          chmod 600 "$FDROID_DIR/config.yml"

          # Carry over everything already published so the index keeps old versions
          if [ -d "$PAGES_DIR/fdroid/repo" ]; then
            cp -r "$PAGES_DIR/fdroid/repo/." "$FDROID_DIR/repo/"
          fi

          # Drop screenshots with the legacy af_weather_ naming
          rm -f "$FDROID_DIR/repo/$PACKAGE_ID/en-US/phoneScreenshots"/af_weather_*.png 2>/dev/null || true

          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          VERSION_CODE=$(aapt2 dump badging "$APK" \
            | sed -n "s/^package:.* versionCode='\([0-9]*\)'.*/\1/p")
          cp "$APK" "$FDROID_DIR/repo/${PACKAGE_ID}_${VERSION_CODE}.apk"

          # Localised text and changelogs live under metadata/<package>/<locale>/,
          # graphics under repo/<package>/<locale>/. Both follow the fastlane layout.
          SRC=fastlane/metadata/android/en-US
          TEXT_DIR="$FDROID_DIR/metadata/$PACKAGE_ID/en-US"
          GFX_DIR="$FDROID_DIR/repo/$PACKAGE_ID/en-US"
          mkdir -p "$TEXT_DIR" "$GFX_DIR"
          cp "$SRC"/*.txt "$TEXT_DIR/"
          cp -r "$SRC/changelogs" "$TEXT_DIR/"
          cp -r "$SRC/images/." "$GFX_DIR/"

          # repo_icon is resolved relative to the working directory
          cp "$SRC/images/icon.png" "$FDROID_DIR/icon.png"

          python3 fdroid/gen-metadata.py "$PACKAGE_ID" \
            "fdroid/metadata/$PACKAGE_ID.yml" \
            "$FDROID_DIR/repo" \
            "$FDROID_DIR/metadata/$PACKAGE_ID.yml"

      - name: Update F-Droid index
        working-directory: ${{ env.FDROID_DIR }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: fdroid update --pretty

      - name: Publish to gh-pages
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -eu
          FINGERPRINT=$(keytool -list -v -keystore "$KEYSTORE_PATH" -alias repo \
            -storepass "$KEYSTORE_PASSWORD" \
            | grep -m1 'SHA256:' | sed 's/.*SHA256: //; s/://g')

          mkdir -p "$PAGES_DIR/fdroid" "$PAGES_DIR/screenshots"
          rm -rf "$PAGES_DIR/fdroid/repo" "$PAGES_DIR/fdroid/archive"
          cp -r "$FDROID_DIR/repo" "$PAGES_DIR/fdroid/repo"
          if [ -d "$FDROID_DIR/archive" ]; then
            cp -r "$FDROID_DIR/archive" "$PAGES_DIR/fdroid/archive"
          fi

          cp fastlane/metadata/android/en-US/images/phoneScreenshots/*.png \
            "$PAGES_DIR/screenshots/"

          sed "s|__FINGERPRINT__|$FINGERPRINT|g" fdroid/index.html.tmpl > "$PAGES_DIR/index.html"
          touch "$PAGES_DIR/.nojekyll"

          cd "$PAGES_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to publish."
          else
            git commit -m "F-Droid repo update for ${{ github.ref_name }}"
            git push origin gh-pages
          fi
