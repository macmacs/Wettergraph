name: Wettergraph
version: "0.3.0"
slug: wettergraph
description: >-
  Renders a Wettergraph-style forecast image for one place - temperature curve,
  weather icons, precipitation band, no wind - from met.no data, and serves it
  as a PNG that a Home Assistant generic camera can poll.
url: https://github.com/macmacs/Wettergraph
arch:
  - aarch64
  - amd64
startup: application
boot: auto
# The fallback route of ticket 06: when the HA instance cannot reach this app's
# port, HA still reads a file, so the graph is also written to
# /share/wettergraph/graph.png for the Local file camera. Inside an app
# container /config is the app's *own* public config folder, not Home
# Assistant's, hence /share.
map:
  - share:rw
# The base image brings its own init (s6-overlay) and refuses to run unless it
# is PID 1. Supervisor's `init` key defaults to true, which hands the container
# to Docker's tini as PID 1 instead, and s6 then dies with
# "s6-overlay-suexec: fatal: can only run as pid 1".
init: false
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Status page and graph image (polled by the generic camera)
watchdog: tcp://[HOST]:[PORT:8099]/health
webui: http://[HOST]:[PORT:8099]/
ingress: true
ingress_port: 8099
panel_icon: mdi:weather-partly-cloudy
panel_title: Wettergraph
options:
  page_note: "setup probe"
  place_id: "2-6325496"
  latitude: 48.1746
  longitude: 11.5538
  update_interval: 15
  image_width: 782
  image_theme: light
schema:
  page_note: str
  place_id: str
  latitude: float(-90,90)
  longitude: float(-180,180)
  update_interval: int(5,180)
  # The two knobs the served image follows when the URL asks for nothing
  # (graph-spec §1.2 clamps, §2.2 falls back to light). A dashboard URL can
  # still override both per request.
  image_width: int(480,1564)
  image_theme: list(light|dark)
